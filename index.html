<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار المفردة الشاذة والارتباط - نموذج 4</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #27ae60; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 8px solid var(--secondary); }
        .header { text-align: center; margin-bottom: 30px; }
        .school-info { font-size: 1.3em; color: var(--secondary); font-weight: bold; }
        .student-board { background: #e8f4fd; padding: 15px; border-radius: 12px; margin-bottom: 25px; border-right: 6px solid var(--secondary); display: flex; justify-content: space-between; align-items: center; }
        .timer-display { font-weight: bold; font-size: 1.4em; color: var(--primary); background: white; padding: 5px 15px; border-radius: 8px; border: 2px solid var(--secondary); }
        .timer-warning { color: var(--danger); border-color: var(--danger); animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        .question-box h3 { background: #f9f9f9; padding: 20px; border-radius: 10px; border: 1px dashed #ccc; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; list-style: none; padding: 0; }
        .options-grid li { padding: 15px; border: 2px solid #eee; border-radius: 12px; cursor: pointer; text-align: center; transition: 0.2s; font-weight: 500; }
        .options-grid li:hover { border-color: var(--secondary); background: #f0f8ff; }
        .options-grid li.selected { background: var(--secondary); color: white; }
        .feedback { margin-top: 20px; padding: 20px; border-radius: 12px; display: none; line-height: 1.6; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 20px; }
        .btn-start { background: var(--success); color: white; }
        .btn-next { background: var(--primary); color: white; }
        .footer-note { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 2px solid #eee; font-style: italic; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>اختبار المفردة الشاذة والارتباط (نموذج 4) 📝✨</h1>
        <div class="school-info">ثانوية الأمير عبدالمجيد 🏫🎓</div>
        <div style="margin-top: 10px; color: #555;">أ / عبدالعزيز الفيفي 👨‍🏫</div>
    </div>
    <div id="start-screen">
        <p style="text-align: center;">الأسئلة مستخرجة من بنك المفردة الشاذة والارتباط. لديك 30 ثانية لكل سؤال:</p>
        <input type="text" id="name-input" placeholder="اكتب اسمك هنا..." style="width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #ddd; margin-bottom: 20px;">
        <button class="btn btn-start" onclick="initQuiz()">ابدأ النموذج الرابع 🚀</button>
    </div>
    <div id="quiz-ui" style="display:none;">
        <div class="student-board"><span id="student-tag"></span><div id="timer-text" class="timer-display">30 ث</div></div>
        <div id="quiz-content"></div>
        <button id="next-btn" class="btn btn-next" onclick="nextQuestion()" style="display:none;">السؤال التالي ⬅️</button>
    </div>
    <div id="results" style="display:none;">
        <h2 style="text-align: center; color: var(--success);">اكتمل النموذج الرابع! 🏁</h2>
        <div id="score-box" style="text-align: center; font-size: 1.8em; margin: 20px 0; font-weight: bold;"></div>
        <div id="summary-list"></div>
        <div class="footer-note">مع تمنياتي لك بمزيد من التقدم والنجاح 🌟<br><strong>أ / عبدالعزيز الفيفي</strong></div>
    </div>
</div>
<script>
const quizData = [
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["كرسي", "محراب", "منبر", "مئذنة"], c: 0, r: "المحراب والمنبر والمئذنة من مكونات المسجد الأساسية، أما الكرسي فهو أثاث عام." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["جبر", "هندسة", "كيمياء", "حساب"], c: 2, r: "الجبر والهندسة والحساب فروع لعلوم الرياضيات، أما الكيمياء علم منفصل." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["الرياض", "القاهرة", "بغداد", "المنامة"], c: 1, r: "الرياض والمنامة عواصم خليجية، وبغداد عاصمة عربية آسيوية، أما القاهرة فتقع في أفريقيا." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["سيف", "خنجر", "رمح", "درع"], c: 3, r: "السيف والخنجر والرمح أدوات للهجوم، أما الدرع فهو أداة للدفاع." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["شمس", "قمر", "مصباح", "نجم"], c: 2, r: "الشمس والقمر والنجم أجرام سماوية طبيعية، أما المصباح فهو وسيلة إضاءة صناعية." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["برتقال", "تفاح", "موز", "نخلة"], c: 3, r: "البرتقال والتفاح والموز أسماء للفواكه، أما النخلة فهي اسم الشجرة المنتجة للثمار." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["حديد", "خشب", "نحاس", "ألمنيوم"], c: 1, r: "الحديد والنحاس والألمنيوم معادن، أما الخشب فمادة عضوية نباتية." },
    { q: "المفردة المرتبطة بكلمة (نحل):", a: ["قرية", "خلية", "وكر", "جحر"], c: 1, r: "النحل يسكن في الخلية، أما الوكر للطيور والجحر للزواحف والقرية للنمل." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["فرح", "سرور", "بهجة", "شجاعة"], c: 3, r: "الفرح والسرور والبهجة مترادفات لمشاعر السعادة، أما الشجاعة فهي صفة سلوكية." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["كتاب", "مجلة", "صحيفة", "قلم"], c: 3, r: "الكتاب والمجلة والصحيفة أوعية معلومات للقراءة، أما القلم فهو أداة للكتابة." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["أبيض", "أسود", "أحمر", "مظلم"], c: 3, r: "الأبيض والأسود والأحمر ألوان، أما المظلم فهي حالة لانعدام الضوء وليست لوناً." },
    { q: "المفردة المرتبطة بكلمة (طائرة):", a: ["مدرج", "رصيف", "محطة", "ميناء"], c: 0, r: "الطائرة تقلع وتهبط في المدرج، أما الرصيف للسيارات والميناء للسفن." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["ثور", "أسد", "نمر", "فهد"], c: 0, r: "الأسد والنمر والفهد من الحيوانات المفترسة، أما الثور فهو حيوان عاشب." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["صيام", "صلاة", "زكاة", "صدقة"], c: 3, r: "الصيام والصلاة والزكاة أركان مفروضة في الإسلام، أما الصدقة فهي تطوعية." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["عمر", "عثمان", "أبو بكر", "معاوية"], c: 3, r: "عمر وعثمان وأبو بكر من الخلفاء الراشدين، أما معاوية فهو مؤسس الدولة الأموية." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["رأس", "وجه", "يد", "عقل"], c: 3, r: "الرأس والوجه واليد أعضاء مادية ملموسة، أما العقل فهو مفهوم معنوي ووظيفة ذهنية." },
    { q: "المفردة المرتبطة بكلمة (بحر):", a: ["لؤلؤ", "خشب", "رمل", "جبل"], c: 0, r: "اللؤلؤ يستخرج من أعماق البحر، أما الرمل فمكانه الشاطئ أو الصحراء." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["سيارة", "حافلة", "شاحنة", "دراجة"], c: 3, r: "السيارة والحافلة والشاحنة تعمل بمحركات وقود، أما الدراجة العادية فتعمل بجهد يدوي." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["ساعة", "دقيقة", "ثانية", "زمن"], c: 3, r: "الساعة والدقيقة والثانية وحدات لقياس الزمن، أما الزمن فهو المفهوم العام." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["شتاء", "صيف", "خريف", "مطر"], c: 3, r: "الشتاء والصيف والخريف فصول مناخية، أما المطر فهو ظاهرة جوية." },
    { q: "المفردة المرتبطة بكلمة (مستشفى):", a: ["طبيب", "مهندس", "نجار", "محام"], c: 0, r: "الطبيب مكانه الأساسي المستشفى، أما المهن الأخرى فأماكنها مختلفة." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["قماش", "حرير", "صوف", "قطن"], c: 0, r: "الحرير والصوف والقطن مواد خام طبيعية، أما القماش فهو المنتج النهائي المصنوع منها." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["سوريا", "لبنان", "الأردن", "مصر"], c: 3, r: "سوريا ولبنان والأردن دول في بلاد الشام، أما مصر فتقع في قارة أفريقيا." },
    { q: "المفردة المرتبطة بكلمة (صحراء):", a: ["سراب", "ثلج", "غابة", "نهر"], c: 0, r: "السراب ظاهرة بصرية تحدث غالباً في الصحراء بسبب الحرارة." },
    { q: "ما هي المفردة الشاذة فيما يلي؟", a: ["سمع", "بصر", "شم", "وجه"], c: 3, r: "السمع والبصر والشم من الحواس الخمس، أما الوجه فهو العضو الحامل لها." }
];
let currentPos = 0, score = 0, stdName = "", records = [], timerId = null, timeLeft = 30;
function initQuiz() {
    stdName = document.getElementById('name-input').value.trim();
    if(!stdName) return alert("لطفاً، اكتب اسمك أولاً!");
    document.getElementById('start-screen').style.display = "none";
    document.getElementById('quiz-ui').style.display = "block";
    document.getElementById('student-tag').innerHTML = `👤 الطالب: <strong>${stdName}</strong>`;
    renderQuestion();
}
function runTimer() {
    timeLeft = 30;
    const timerBox = document.getElementById('timer-text');
    timerBox.innerText = `${timeLeft} ث`;
    timerBox.classList.remove('timer-warning');
    clearInterval(timerId);
    timerId = setInterval(() => {
        timeLeft--;
        timerBox.innerText = `${timeLeft} ث`;
        if(timeLeft <= 5) timerBox.classList.add('timer-warning');
        if(timeLeft <= 0) { clearInterval(timerId); handleAutoSkip(); }
    }, 1000);
}
function renderQuestion() {
    const data = quizData[currentPos];
    document.getElementById('quiz-content').innerHTML = `
        <div style="color:#888; font-weight:bold; margin-bottom:10px;">السؤال ${currentPos + 1} من ${quizData.length}</div>
        <div class="question-box"><h3>${data.q}</h3></div>
        <ul class="options-grid" id="opts">
            ${data.a.map((opt, i) => `<li onclick="onSelect(this, ${i})">${opt}</li>`).join('')}
        </ul>
        <div id="fb" class="feedback"></div>
    `;
    document.getElementById('next-btn').style.display = "none";
    runTimer();
}
function onSelect(el, idx) {
    if(document.getElementById('next-btn').style.display === "block") return;
    clearInterval(timerId);
    const data = quizData[currentPos];
    const isCorrect = (idx === data.c);
    if(isCorrect) score++;
    records.push({q: data.q, user: data.a[idx], correct: data.a[data.c], isCorrect, r: data.r});
    el.classList.add('selected');
    const fb = document.getElementById('fb');
    fb.style.display = "block";
    fb.style.background = isCorrect ? "#d4edda" : "#f8d7da";
    fb.innerHTML = `<strong>${isCorrect ? '✅ صح' : '❌ خطأ'}</strong><br>${data.r}`;
    document.getElementById('next-btn').style.display = "block";
}
function handleAutoSkip() {
    if(document.getElementById('next-btn').style.display === "block") return;
    records.push({q: quizData[currentPos].q, user: "انتهى الوقت", correct: quizData[currentPos].a[quizData[currentPos].c], isCorrect: false, r: "لم تجب في الوقت المحدد."});
    nextQuestion();
}
function nextQuestion() {
    currentPos++;
    if(currentPos < quizData.length) renderQuestion();
    else finalize();
}
function finalize() {
    document.getElementById('quiz-ui').style.display = "none";
    document.getElementById('results').style.display = "block";
    document.getElementById('score-box').innerText = `الدرجة النهائية: ${score} من ${quizData.length}`;
    let html = "<h4>مراجعة الإجابات والشرح (نموذج 4):</h4>";
    records.forEach((rec, i) => {
        html += `<div style="padding:10px; border-bottom:1px solid #eee;">
            <strong>${i+1}. ${rec.q}</strong><br>
            إجابتك: <span style="color:${rec.isCorrect?'green':'red'}">${rec.user}</span> | 
            الصحيحة: <span style="color:green">${rec.correct}</span><br>
            <small>💡 ${rec.r}</small>
        </div>`;
    });
    document.getElementById('summary-list').innerHTML = html;
}
</script>
</body>
</html>
